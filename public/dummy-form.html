<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Dummy Form</title>
</head>
<body>
  <!-- Ezt senki se látja, de a Netlify ebből tudja, hogy létezik a formod -->
  <form name="Nyaloda-Velemeny" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="radio" name="kornyezet" />
    <input type="radio" name="receptura" />
    <input type="radio" name="elmeny" />
    <input type="checkbox" name="jovokep" />
    <input type="text" name="jovokep_mas" />
    <input type="radio" name="teli_nyitva" />
    <input type="radio" name="kabalak" />
    <textarea name="feketeleves"></textarea>
  </form>
</body>
</html>
